<!DOCTYPE html>
<html lang="vi">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <nav class="navbar" id="navbar" aria-label="Chuyên mục">
      <div class="container nav-inner">
        <ul class="nav-list" id="navList"></ul>
      </div>
    </nav>
  </header>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <!-- ===== NỘI DUNG CHÍNH (render bằng JavaScript theo URL #hash) ===== -->
  <main id="app" class="container" tabindex="-1"></main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer" id="footer"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Dữ liệu mẫu (để mở trực tiếp file:// vẫn chạy). Được tạo lại khi chạy npm run crawl -->
  <script src="data/seed.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/crawler.js"></script>
  <script src="js/app.js"></script>

</html>
